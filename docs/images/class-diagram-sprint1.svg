<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .cls-box { fill: #f8fafc; stroke: #6366f1; stroke-width: 2; rx: 8; }
      .cls-header { fill: #6366f1; }
      .cls-header-text { fill: #ffffff; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .cls-text { fill: #1e293b; font-size: 13px; }
      .cls-text-pk { fill: #b91c1c; font-size: 13px; font-weight: bold; }
      .cls-text-fk { fill: #0369a1; font-size: 13px; font-style: italic; }
      .cls-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: none; fill: none; }
      .cls-card { font-size: 12px; fill: #4f46e5; font-weight: bold; }
      .cls-title { font-size: 20px; font-weight: bold; fill: #1e1b4b; text-anchor: middle; }
      .cls-subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="450" y="30" class="cls-title">EventOrganizer — Relational Class Diagram (Sprint 1 / SQLite EF Core)</text>
  <text x="450" y="50" class="cls-subtitle">Модель збережуваних даних: сутності, первинні (PK) та зовнішні ключі (FK), кратності зв'язків</text>

  <!-- USER -->
  <g transform="translate(60, 90)">
    <rect width="200" height="150" class="cls-box" />
    <path d="M 0,0 L 200,0 L 200,32 L 0,32 Z" class="cls-header" />
    <text x="100" y="21" class="cls-header-text">User</text>
    <text x="15" y="55" class="cls-text-pk">+ Id: int [PK]</text>
    <text x="15" y="80" class="cls-text">+ Email: string (Unique)</text>
    <text x="15" y="105" class="cls-text">+ PasswordHash: string</text>
    <text x="15" y="130" class="cls-text">+ Name: string</text>
  </g>

  <!-- EVENT -->
  <g transform="translate(350, 80)">
    <rect width="210" height="210" class="cls-box" />
    <path d="M 0,0 L 210,0 L 210,32 L 0,32 Z" class="cls-header" />
    <text x="105" y="21" class="cls-header-text">Event</text>
    <text x="15" y="55" class="cls-text-pk">+ Id: int [PK]</text>
    <text x="15" y="80" class="cls-text">+ Title: string</text>
    <text x="15" y="105" class="cls-text">+ Date: DateTime</text>
    <text x="15" y="130" class="cls-text">+ Place: string</text>
    <text x="15" y="155" class="cls-text">+ Description: string</text>
    <text x="15" y="180" class="cls-text">+ InviteCode: string</text>
    <text x="15" y="202" class="cls-text">+ Status: EventStatus</text>
  </g>

  <!-- PARTICIPATION -->
  <g transform="translate(60, 360)">
    <rect width="220" height="160" class="cls-box" />
    <path d="M 0,0 L 220,0 L 220,32 L 0,32 Z" class="cls-header" />
    <text x="110" y="21" class="cls-header-text">Participation</text>
    <text x="15" y="55" class="cls-text-pk">+ Id: int [PK]</text>
    <text x="15" y="80" class="cls-text-fk">+ UserId: int [FK]</text>
    <text x="15" y="105" class="cls-text-fk">+ EventId: int [FK]</text>
    <text x="15" y="130" class="cls-text">+ Role: ParticipantRole</text>
    <text x="15" y="152" class="cls-text">+ JoinedAt: DateTime</text>
  </g>

  <!-- EXPENSE -->
  <g transform="translate(350, 360)">
    <rect width="230" height="175" class="cls-box" />
    <path d="M 0,0 L 230,0 L 230,32 L 0,32 Z" class="cls-header" />
    <text x="115" y="21" class="cls-header-text">Expense</text>
    <text x="15" y="55" class="cls-text-pk">+ Id: int [PK]</text>
    <text x="15" y="80" class="cls-text-fk">+ EventId: int [FK]</text>
    <text x="15" y="105" class="cls-text-fk">+ PayerParticipationId: int [FK]</text>
    <text x="15" y="130" class="cls-text">+ Amount: decimal(18,2)</text>
    <text x="15" y="152" class="cls-text">+ Description: string</text>
    <text x="15" y="170" class="cls-text">+ CreatedAt: DateTime</text>
  </g>

  <!-- EXPENSE SHARE -->
  <g transform="translate(660, 360)">
    <rect width="200" height="145" class="cls-box" />
    <path d="M 0,0 L 200,0 L 200,32 L 0,32 Z" class="cls-header" />
    <text x="100" y="21" class="cls-header-text">ExpenseShare</text>
    <text x="15" y="55" class="cls-text-pk">+ Id: int [PK]</text>
    <text x="15" y="80" class="cls-text-fk">+ ExpenseId: int [FK]</text>
    <text x="15" y="105" class="cls-text-fk">+ ParticipationId: int [FK]</text>
    <text x="15" y="130" class="cls-text">+ Amount: decimal(18,2)</text>
  </g>

  <!-- Relationships -->
  <!-- User (1) to Participation (0..*) -->
  <line x1="160" y1="240" x2="160" y2="360" class="cls-line" />
  <text x="168" y="260" class="cls-card">1</text>
  <text x="168" y="348" class="cls-card">0..*</text>

  <!-- Event (1) to Participation (1..*) -->
  <path d="M 350,180 L 250,180 L 250,360" class="cls-line" />
  <text x="325" y="172" class="cls-card">1</text>
  <text x="258" y="348" class="cls-card">1..*</text>

  <!-- Event (1) to Expense (0..*) -->
  <line x1="455" y1="290" x2="455" y2="360" class="cls-line" />
  <text x="462" y="310" class="cls-card">1</text>
  <text x="462" y="348" class="cls-card">0..*</text>

  <!-- Participation (1) to Expense (0..*) [Payer] -->
  <line x1="280" y1="440" x2="350" y2="440" class="cls-line" />
  <text x="288" y="432" class="cls-card">1</text>
  <text x="322" y="432" class="cls-card">0..*</text>

  <!-- Expense (1) to ExpenseShare (1..*) -->
  <line x1="580" y1="430" x2="660" y2="430" class="cls-line" />
  <text x="590" y="422" class="cls-card">1</text>
  <text x="632" y="422" class="cls-card">1..*</text>

  <!-- Participation to ExpenseShare (ParticipationId FK) -->
  <path d="M 170,520 L 170,570 L 760,570 L 760,505" class="cls-line" />
  <text x="180" y="555" class="cls-card">1</text>
  <text x="768" y="540" class="cls-card">0..*</text>
</svg>
